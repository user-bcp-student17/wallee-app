# Despliegue local con Podman: podman compose up --build -d
name: wallee-app
services:
  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      PORT: "3000"
      NODE_ENV: development
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-8090}
      DB_PATH: /app/data/wallee.sqlite
      DB_SEED: "true"
    volumes:
      - wallee-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      target: runtime
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8090}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  wallee-data: